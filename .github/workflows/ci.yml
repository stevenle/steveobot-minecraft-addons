name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Reads the version from package.json's "packageManager" field.
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Validate manifests
        run: pnpm run validate

      - name: Typecheck
        run: pnpm run typecheck

      - name: Test
        run: pnpm run test

      - name: Build
        run: pnpm run build:release

      - name: Package
        run: node tools/package.ts --no-build

      - uses: actions/upload-artifact@v4
        with:
          name: mcaddons
          path: dist/_packages/*.mcaddon
          if-no-files-found: error
